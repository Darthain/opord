name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licence header check
        run: python3 tools/check_headers.py
      - uses: arma-actions/hemtt@v1
      - name: HEMTT check
        run: hemtt check
      - name: HEMTT build
        run: hemtt build
